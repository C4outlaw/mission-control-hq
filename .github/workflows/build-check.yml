name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Syntax check
        run: node scripts/check-syntax.mjs $(git ls-files '*.js' '*.jsx' '*.mjs' '*.cjs' '*.ts' '*.tsx')
      - name: Production build
        run: npm run build
